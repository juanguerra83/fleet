<!DOCTYPE html>
<!--
  FLEET TRACKER - personal iPhone launcher for Brian
  This page only holds Brian's icon and opens the Google app directly.
  Upload this as index.html next to apple-touch-icon.png in the "brian" folder on GitHub.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  html,body{margin:0;min-height:100%;background:#0a0b0e;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:128px;height:128px;border-radius:28px}
  h1{margin:0;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
  a.btn{background:#e8641e;color:#ffffff;text-decoration:none;font-weight:600;padding:15px 30px;border-radius:14px;font-size:17px}
  .tip{color:#8b93a1;font-size:14px;line-height:1.5;max-width:300px}
  .tip b{color:#f3f4f6}
</style>
</head>
<body>
<div class="wrap" id="wrap" style="visibility:hidden">
  <img src="apple-touch-icon.png" alt="" onerror="this.style.display='none'">
  <h1>Garage</h1>
  <a class="btn" id="open" href="#">Open</a>
  <div class="tip" id="tip">On iPhone, put this on your home screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>
</div>
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxCQNbuCmSMeY3XjdplKiUq-55tnqVcYvk_oWAGjIk0_MgGPwHF8vtzV279WDRvjXFNAQ/exec';
  const USER    = 'Brian';   // must match the Users tab
  const PIN     = '';      // leave blank if this person has no PIN in the Users tab

  const here = new URLSearchParams(location.search);
  const q = new URLSearchParams();
  q.set('user', USER);
  if (PIN) q.set('key', PIN);
  if (here.get('car')) q.set('car', here.get('car'));
  const target = APP_URL + (APP_URL.indexOf('?') > -1 ? '&' : '?') + q.toString();
  document.getElementById('open').href = target;

  // Opened from the home screen icon: go straight into the app.
  // Opened in a normal browser tab: stay here so you can tap Add to Home Screen (or tap Open).
  const fromHomeScreen = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (fromHomeScreen || here.get('go') === '1') location.replace(target);
  else document.getElementById('wrap').style.visibility = 'visible';
</script>
</body>
</html>
