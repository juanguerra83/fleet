<!DOCTYPE html>
<!--
  FLEET TRACKER - personal iPhone launcher (one copy per person, each with its own icon)

  SETUP
  1) Make one folder per person on your website, for example (GoDaddy File Manager):
        finalpartssource.com/fleet/juan/
        finalpartssource.com/fleet/dad/
        finalpartssource.com/fleet/uncle/
  2) In each folder put:
        index.html            = this file, with USER below set to that person's name (same as the Users tab)
        apple-touch-icon.png  = that person's icon (rename their icon file to exactly this)
  3) Paste the web app URL (Deploy > Manage deployments) into APP_URL below.
  4) Each person opens THEIR folder link in Safari > Share > Add to Home Screen.
     They get their own icon, and the app opens with their name already picked (PIN only).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0a0b0e}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#0a0b0e}
</style>
</head>
<body>
<script>
  const APP_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
  const USER    = 'Brian';     // must match the Users tab

  const here = new URLSearchParams(location.search);
  const q = new URLSearchParams();
  q.set('user', USER);
  if (here.get('car')) q.set('car', here.get('car'));
  const f = document.createElement('iframe');
  f.src = APP_URL + (APP_URL.indexOf('?') > -1 ? '&' : '?') + q.toString();
  f.allow = 'clipboard-write; web-share';
  document.body.appendChild(f);
</script>
</body>
</html>
